<text x="85" y="1504" font-family="Arial, Helvetica, sans-serif" font-size="27" fill="#142d42" font-weight="700" text-anchor="start">GPIO6</text>
<line x1="192" y1="1496" x2="254" y2="1496" stroke="#007d78" stroke-width="4" marker-end="url(#arrow)"/>
<rect x="259" y="1474" width="70" height="44" rx="6" fill="white" stroke="#007d78" stroke-width="2"/>
