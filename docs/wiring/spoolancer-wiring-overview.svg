<line x1="329" y1="1496" x2="401" y2="1496" stroke="#007d78" stroke-width="4" marker-end="url(#arrow)"/>
<rect x="409" y="1468" width="365" height="61" rx="8" fill="white" stroke="#007d78" stroke-width="2"/>
<text x="591" y="1507" font-family="Arial, Helvetica, sans-serif" font-size="24" fill="#007d78" font-weight="700" text-anchor="middle">74AHCT125 · 3.3 V → 5 V</text>
<line x1="774" y1="1496" x2="848" y2="1496" stroke="#007d78" stroke-width="4" marker-end="url(#arrow)"/>
<rect x="856" y="1474" width="137" height="44" rx="4" fill="white" stroke="#007d78" stroke-width="2"/>
<text x="924" y="1504" font-family="Arial, Helvetica, sans-serif" font-size="25" fill="#007d78" font-weight="700" text-anchor="middle">330 Ω</text>
<line x1="993" y1="1496" x2="1081" y2="1496" stroke="#007d78" stroke-width="4" marker-end="url(#arrow)"/>
<text x="1093" y="1505" font-family="Arial, Helvetica, sans-serif" font-size="25" fill="#142d42" font-weight="700" text-anchor="start">DIN → [1] → [2] → [3] → [4] → [5]</text>
<text x="84" y="1565" font-family="Arial, Helvetica, sans-serif" font-size="23" fill="#142d42" font-weight="400" text-anchor="start">Buffer: 100 nF bypass + 10 kΩ input pull-down. Strip: 1000 µF / 10 V across 5V (+) and GND (−).</text>
<text x="84" y="1598" font-family="Arial, Helvetica, sans-serif" font-size="22" fill="#506475" font-weight="400" text-anchor="start">J2 disconnects the GPIO6 lead. Last pixel DOUT stays unconnected. Strip arrows point away from DIN.</text>
<text x="60" y="1664" font-family="Arial, Helvetica, sans-serif" font-size="26" fill="#142d42" font-weight="700" text-anchor="start">BOOT is already on the board: no external button or extra wiring.</text>
<text x="60" y="1706" font-family="Arial, Helvetica, sans-serif" font-size="24" fill="#c6323d" font-weight="700" text-anchor="start">Before computer USB: switch off 12 V, disconnect J1 (buck → ESP) and J2 (GPIO6 → buffer).</text>
<text x="60" y="1750" font-family="Arial, Helvetica, sans-serif" font-size="21" fill="#506475" font-weight="400" text-anchor="start">Signal map only. Module pin order varies; match printed labels. Physical wiring and operation still require verification.</text>
</svg>