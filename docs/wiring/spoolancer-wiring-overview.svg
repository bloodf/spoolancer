<text x="1290" y="1310" font-family="Arial, Helvetica, sans-serif" font-size="21" fill="#506475" font-weight="400" text-anchor="start">Match the actual controller/address.</text>
<text x="60" y="1420" font-family="Arial, Helvetica, sans-serif" font-size="26" fill="#142d42" font-weight="700" text-anchor="start">3  FIVE RGB LEDS — see the separate buffer detail for all 14 IC pins</text>
