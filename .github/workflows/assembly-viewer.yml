name: Assembly viewer

on:
  push:
    branches: [main]
    paths:
      - 'viewer/**'
      - 'tools/build_viewer.py'
      - 'cad/assembly-parts.json'
      - 'cad/variants/headless-led/previews/scene.json'
      - 'cad/variants/oled-led/previews/scene.json'
      - '.github/workflows/assembly-viewer.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: assembly-viewer-pages
  cancel-in-progress: false

jobs:
  build:
    if: github.repository == 'bloodf/spoolancer' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      pages: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.12'
      - name: Verify viewer matches committed CAD
        run: python3 tools/build_viewer.py --check
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: viewer

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish assembly viewer
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
